schema: spec-driven

context: |
  Follow CLAUDE.md; in Codex also follow AGENTS.md.
  Personal Nuxt/Vue GitHub showcase: idiomatic code and useful tests, minimal process.
  Read only relevant inventory, docs, code, and backend contract sections.
  Reuse the existing UI and adapt to the fixed API; never change the API repo.

rules:
  proposal:
    - Keep scope and out-of-scope concise; use existing capability paths
  design:
    - Keep small-change design brief; prefer Nuxt / Nuxt UI built-ins over new packages
  tasks:
    - For substantial new flows/layouts, consult ui-ux-expert inline; no mandatory agent pipeline
    - Test observable changed behavior and likely regressions; E2E only with explicit authorization
    - Code changes end with relevant unit tests, pnpm typecheck, and pnpm lint; full pnpm test only for broad/shared changes
    - Docs/instructions-only changes use changed-file formatting and reference checks
    - Update docs/STATUS.md via log-progress only for notable UI milestones
